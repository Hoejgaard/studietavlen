# Bygger site/ med Astro og deployer til GitHub Pages ved push til main.
# Kræver at Pages er sat til "GitHub Actions" under Settings > Pages i repoet.
name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4
      - name: Byg sitet med Astro
        uses: withastro/action@v3
        with:
          path: ./site
          node-version: 24
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til Pages
        id: deployment
        uses: actions/deploy-pages@v4
