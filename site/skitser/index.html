<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studietavlen – skitse</title>
<style>
  :root {
    --bg: #04080f;
    --bg2: #081220;
    --line: rgba(0, 220, 255, 0.18);
    --line-strong: rgba(0, 220, 255, 0.45);
    --cyan: #19e3ff;
    --cyan-dim: #0aa7c2;
    --gold: #ffc864;
    --text: #d8f4ff;
    --muted: #7fb3c4;
    --panel: rgba(4, 14, 26, 0.92);
    --font: "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Code", "Consolas", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
  canvas#hud { position: fixed; inset: 0; z-index: 0; }
  #app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: 56px 1fr; }

  header { display: flex; align-items: center; gap: 18px; padding: 0 20px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(4,8,15,.9), rgba(4,8,15,.6)); }
  header h1 { font-size: 15px; letter-spacing: .28em; text-transform: uppercase; margin: 0; color: var(--cyan); font-weight: 600; }
  header .sub { font-size: 11px; color: var(--muted); letter-spacing: .12em; }
  .spacer { flex: 1; }
  .toggle { display: flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; }
  .toggle button { background: transparent; color: var(--muted); border: 0; padding: 7px 14px; font: inherit; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; }
  .toggle button.on { background: rgba(25,227,255,.14); color: var(--cyan); }
  .cmd { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 10px; background: rgba(0,0,0,.35); min-width: 280px; }
  .cmd kbd { font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; }
  .cmd input { background: transparent; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 13px; flex: 1; }

  main { position: relative; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }

  /* ---------- Variant A: ringe ---------- */
  #ringe svg { width: 100%; height: 100%; }
  .sector-label { font-size: 11px; fill: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
  .sector-line { stroke: var(--line); stroke-width: 1; }
  .ring { fill: none; stroke: var(--line); stroke-width: 1; }
  .ring.major { stroke: var(--line-strong); stroke-dasharray: 2 6; }
  .node { cursor: pointer; }
  .node circle { fill: rgba(4,14,26,.9); stroke: var(--cyan-dim); stroke-width: 1.4; transition: all .15s; }
  .node:hover circle, .node.active circle { stroke: var(--cyan); fill: rgba(25,227,255,.18); filter: drop-shadow(0 0 6px var(--cyan)); }
  .node text { font-size: 10.5px; fill: var(--text); pointer-events: none; }
  .node.r5 circle { stroke: var(--gold); }
  .core { cursor: pointer; }
  .core circle { fill: rgba(25,227,255,.08); stroke: var(--cyan); stroke-width: 1.5; }
  .core text { fill: var(--cyan); font-size: 11px; letter-spacing: .2em; text-anchor: middle; text-transform: uppercase; }

  /* ---------- Variant B: tavle ---------- */
  #tavle { overflow: auto; padding: 18px 20px 40px; }
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .group { border: 1px solid var(--line); background: rgba(4,14,26,.75); border-radius: 6px; padding: 10px 10px 6px; }
  .group h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); font-weight: 600; display: flex; justify-content: space-between; }
  .group h2 span { color: var(--muted); font-weight: 400; letter-spacing: 0; }
  .card { border: 1px solid var(--line); border-left: 3px solid var(--cyan-dim); border-radius: 3px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer; background: rgba(0,0,0,.25); transition: all .15s; }
  .card:hover, .card.active { border-color: var(--cyan); background: rgba(25,227,255,.1); box-shadow: 0 0 10px rgba(25,227,255,.25); }
  .card.r5 { border-left-color: var(--gold); }
  .card .t { font-size: 13px; font-weight: 600; }
  .card .m { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .dots { color: var(--gold); letter-spacing: 2px; font-size: 9px; }

  /* ---------- hover-HUD ---------- */
  #hover { position: fixed; z-index: 5; pointer-events: none; max-width: 360px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 4px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; display: none; box-shadow: 0 0 24px rgba(25,227,255,.15); }
  #hover .h { color: var(--cyan); font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  #hover .k { color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-top: 7px; }

  /* ---------- side panel (klik) ---------- */
  #side { position: fixed; top: 56px; right: 0; bottom: 0; width: min(560px, 100%); z-index: 6; background: var(--panel); border-left: 1px solid var(--line-strong); transform: translateX(100%); transition: transform .22s ease; overflow: auto; padding: 18px 22px 40px; box-shadow: -10px 0 40px rgba(0,0,0,.5); }
  #side.open { transform: none; }
  #side .close { position: absolute; top: 10px; right: 12px; background: transparent; border: 1px solid var(--line-strong); color: var(--cyan); border-radius: 3px; padding: 3px 9px; cursor: pointer; font: inherit; }
  #side .eyebrow { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  #side h1 { font-size: 20px; margin: 4px 0 10px; color: var(--cyan); }
  #side .meta { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 10px; margin-bottom: 14px; }
  #side .meta b { color: var(--muted); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; font-size: 10px; }
  #side article { font-size: 13.5px; line-height: 1.55; }
  #side article h2 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); margin: 20px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  #side article h2.begreber { color: var(--gold); border-color: rgba(255,200,100,.35); }
  #side article ul { padding-left: 18px; }
  #side article li { margin: 3px 0; }
  #side article table { border-collapse: collapse; font-size: 12px; margin: 8px 0; }
  #side article td, #side article th { border: 1px solid var(--line); padding: 4px 7px; vertical-align: top; }
  #side article th { color: var(--cyan); text-align: left; }
  #side article a { color: var(--cyan); }
  #side .rel { margin-top: 18px; font-size: 12px; }
  #side .rel a { display: inline-block; margin: 3px 6px 0 0; border: 1px solid var(--line-strong); border-radius: 3px; padding: 2px 8px; color: var(--cyan); text-decoration: none; }

  /* ---------- palette ---------- */
  #palette { position: fixed; z-index: 7; top: 60px; left: 50%; transform: translateX(-50%); width: min(620px, 94vw); background: var(--panel); border: 1px solid var(--cyan); border-radius: 4px; display: none; max-height: 60vh; overflow: auto; }
  #palette.open { display: block; }
  #palette .row { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  #palette .row:hover, #palette .row.sel { background: rgba(25,227,255,.12); }
  #palette .row .b { font-size: 10px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; min-width: 150px; }
  #palette .row .k { font-size: 11px; color: var(--muted); }

  .note { position: fixed; left: 14px; bottom: 10px; z-index: 4; font-size: 11px; color: var(--muted); background: rgba(4,8,15,.8); border: 1px solid var(--line); padding: 5px 9px; border-radius: 3px; }
</style>
</head>
<body>
<canvas id="hud"></canvas>
<div id="app">
  <header>
    <h1>Studietavlen</h1>
    <span class="sub">OTP · Organisering i teori og praksis · skitse</span>
    <div class="spacer"></div>
    <div class="cmd"><kbd>Ctrl K</kbd><input id="q" placeholder="Spring til emne, teoretiker, begreb…"></div>
    <div class="toggle">
      <button data-view="ringe" class="on">Ringe</button>
      <button data-view="tavle">Tavle</button>
    </div>
  </header>
  <main>
    <section id="ringe" class="view on"><svg viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet"></svg></section>
    <section id="tavle" class="view"><div class="groups"></div></section>
  </main>
</div>
<div id="hover"></div>
<aside id="side"><button class="close">Luk ✕</button><div id="side-body"></div></aside>
<div id="palette"></div>
<div class="note">Skitse. Hover = kort intro · klik = fuldt emne · Ctrl K = spring · guld = relevans 5</div>

<script>
const FAG = '/content/otp/fag.json';
const EMNE = s => `/content/otp/emner/${s}.md`;
let data, emner = [], bySlug = {};

/* ---------- HUD-baggrund (let partikel-HUD, ikke three.js) ---------- */
(function hud() {
  const c = document.getElementById('hud'), ctx = c.getContext('2d');
  let W, H, t = 0;
  const P = Array.from({ length: 260 }, (_, i) => ({ a: Math.random() * Math.PI * 2, r: .25 + Math.random() * .75, s: (.2 + Math.random() * .8) * (i % 2 ? 1 : -1), z: Math.random() }));
  function size() { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; }
  addEventListener('resize', size); size();
  (function frame() {
    t += .004; ctx.clearRect(0, 0, W, H);
    const cx = W * .5, cy = H * .55, R = Math.min(W, H) * .62;
    ctx.lineWidth = 1 * devicePixelRatio;
    for (let k = 1; k <= 4; k++) { ctx.beginPath(); ctx.arc(cx, cy, R * k / 4, 0, Math.PI * 2); ctx.strokeStyle = `rgba(0,220,255,${.05 + .02 * (k % 2)})`; ctx.stroke(); }
    const sweep = t * 1.5;
    const g = ctx.createConicGradient(sweep, cx, cy); g.addColorStop(0, 'rgba(25,227,255,.10)'); g.addColorStop(.12, 'rgba(25,227,255,0)'); g.addColorStop(1, 'rgba(25,227,255,0)');
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
    for (const p of P) { const a = p.a + t * p.s, r = R * p.r + Math.sin(t * 3 + p.z * 9) * 4; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, (1 + p.z) * devicePixelRatio, 0, 7); ctx.fillStyle = `rgba(25,227,255,${.15 + p.z * .35})`; ctx.fill(); }
    requestAnimationFrame(frame);
  })();
})();

/* ---------- data ---------- */
fetch(FAG).then(r => r.json()).then(d => {
  data = d; emner = d.emner; emner.forEach(e => bySlug[e.slug] = e);
  drawRinge(); drawTavle(); buildPalette('');
});

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dots = n => '●'.repeat(n) + '○'.repeat(5 - n);

/* ---------- Variant A: sektorer pr. blik, radius efter relevans ---------- */
function drawRinge() {
  const svg = document.querySelector('#ringe svg'); svg.innerHTML = '';
  const cx = 600, cy = 390, Rmax = 330, Rmin = 125;
  const blikke = data.blikke;
  const n = blikke.length, step = Math.PI * 2 / n;
  const ns = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, txt) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; return e; };
  // ringe (kun dekorative; relevans vises som størrelse og guld)
  for (let r = 0; r <= 3; r++) { const rad = Rmin + r * (Rmax - Rmin) / 3; svg.appendChild(el('circle', { class: 'ring' + (r === 0 || r === 3 ? ' major' : ''), cx, cy, r: rad })); }
  blikke.forEach((b, i) => {
    const a0 = -Math.PI / 2 + i * step;
    svg.appendChild(el('line', { class: 'sector-line', x1: cx + Math.cos(a0) * Rmin * .85, y1: cy + Math.sin(a0) * Rmin * .85, x2: cx + Math.cos(a0) * (Rmax + 12), y2: cy + Math.sin(a0) * (Rmax + 12) }));
    const am = a0 + step / 2, lx = cx + Math.cos(am) * (Rmax + 42), ly = cy + Math.sin(am) * (Rmax + 42);
    const t = el('text', { class: 'sector-label', x: lx, y: ly, 'text-anchor': Math.cos(am) > .2 ? 'start' : Math.cos(am) < -.2 ? 'end' : 'middle', 'dominant-baseline': 'middle' }, b.replace(/\s*\(.*\)/, ''));
    svg.appendChild(t);
    const items = emner.filter(e => e.blik === b).sort((p, q) => q.relevans - p.relevans);
    items.forEach((e, j) => {
      // vigtigste inderst, resten spredt jævnt udad; vinkel zigzagger så labels ikke rammer hinanden
      const a = a0 + step * (j % 2 ? .68 : .32);
      const rad = Rmin + (j + .5) * (Rmax - Rmin) / items.length;
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      const g = el('g', { class: 'node r' + e.relevans, 'data-slug': e.slug });
      g.appendChild(el('circle', { cx: x, cy: y, r: 6 + e.relevans * 1.6 }));
      const label = el('text', { x: x + (Math.cos(a) >= 0 ? 14 : -14), y: y + 4, 'text-anchor': Math.cos(a) >= 0 ? 'start' : 'end' }, shortTitle(e.title));
      g.appendChild(label);
      bind(g, e); svg.appendChild(g);
    });
  });
  const core = el('g', { class: 'core' });
  core.appendChild(el('circle', { cx, cy, r: 58 }));
  core.appendChild(el('text', { x: cx, y: cy - 6 }, 'Optik'));
  core.appendChild(el('text', { x: cx, y: cy + 12 }, 'oversigt'));
  core.addEventListener('click', openOptik);
  svg.appendChild(core);
}
function shortTitle(t) { const s = t.replace(/\s*\(.*?\)\s*/g, ' ').replace(/:.*$/, '').trim(); return s.length > 26 ? s.slice(0, 24) + '…' : s; }

/* ---------- Variant B: kolonner pr. blik ---------- */
function drawTavle() {
  const root = document.querySelector('#tavle .groups'); root.innerHTML = '';
  data.blikke.forEach(b => {
    const items = emner.filter(e => e.blik === b).sort((a, c) => c.relevans - a.relevans);
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<h2>${esc(b)} <span>${items.length}</span></h2>`;
    items.forEach(e => {
      const c = document.createElement('div'); c.className = 'card r' + e.relevans; c.dataset.slug = e.slug;
      c.innerHTML = `<div class="t">${esc(e.title)}</div><div class="m">${esc(e.teoretikere.slice(0, 2).join(', '))} · <span class="dots">${dots(e.relevans)}</span></div>`;
      bind(c, e); g.appendChild(c);
    });
    root.appendChild(g);
  });
}

/* ---------- hover + klik ---------- */
const hov = document.getElementById('hover');
function bind(elm, e) {
  elm.addEventListener('mouseenter', ev => {
    hov.innerHTML = `<div class="h">${esc(e.title)}</div>${esc(e.kort)}<div class="k">Interesse</div>${esc(e.interesse)}<div class="k">Fænomener</div>${esc(e.faenomener)}`;
    hov.style.display = 'block'; move(ev);
  });
  elm.addEventListener('mousemove', move);
  elm.addEventListener('mouseleave', () => hov.style.display = 'none');
  elm.addEventListener('click', () => openEmne(e.slug));
}
function move(ev) { const x = Math.min(ev.clientX + 18, innerWidth - 380), y = Math.min(ev.clientY + 18, innerHeight - 220); hov.style.left = x + 'px'; hov.style.top = y + 'px'; }

const side = document.getElementById('side'), sideBody = document.getElementById('side-body');
document.querySelector('#side .close').onclick = () => { side.classList.remove('open'); mark(null); };
function mark(slug) { document.querySelectorAll('.node,.card').forEach(x => x.classList.toggle('active', x.dataset.slug === slug)); }
async function openEmne(slug) {
  const e = bySlug[slug]; if (!e) return; mark(slug); side.classList.add('open'); hov.style.display = 'none';
  sideBody.innerHTML = `<div class="eyebrow">${esc(e.blik)} · forelæsning ${e.forelaesning.join(', ')} · <span class="dots">${dots(e.relevans)}</span></div><h1>${esc(e.title)}</h1><div class="meta"><b>Teoretikere</b><span>${esc(e.teoretikere.join(', '))}</span><b>Interesse</b><span>${esc(e.interesse)}</span><b>Fænomener</b><span>${esc(e.faenomener)}</span></div><article>Henter…</article>`;
  const md = await fetch(EMNE(slug)).then(r => r.text());
  sideBody.querySelector('article').innerHTML = mdToHtml(md.replace(/^﻿?---[\s\S]*?\r?\n---\r?\n/, ''));
  const rel = document.createElement('div'); rel.className = 'rel'; rel.innerHTML = '<div class="eyebrow">Relaterede</div>' + e.relaterede.map(s => `<a href="#" data-go="${s}">${esc(bySlug[s]?.title || s)}</a>`).join('');
  sideBody.appendChild(rel);
  sideBody.querySelectorAll('[data-go]').forEach(a => a.onclick = ev => { ev.preventDefault(); openEmne(a.dataset.go); side.scrollTop = 0; });
  side.scrollTop = 0;
}
function openOptik() {
  side.classList.add('open'); mark(null);
  const rows = emner.filter(e => e.blik !== 'Cases' && e.blik !== 'Grundlag og metode').map(e => `<tr><td>${esc(e.blik)}</td><td>${esc(e.teoretikere.join(', '))}</td><td>${esc(e.interesse)}</td><td>${esc(e.faenomener)}</td><td><a href="#" data-go="${e.slug}">→</a></td></tr>`).join('');
  sideBody.innerHTML = `<div class="eyebrow">Undervisers optik, lektion 5 s. 5-6</div><h1>Fagets analytiske optik</h1><article><table><tr><th>Blik</th><th>Teoretikere</th><th>Interesse</th><th>Fænomener</th><th></th></tr>${rows}</table></article>`;
  sideBody.querySelectorAll('[data-go]').forEach(a => a.onclick = ev => { ev.preventDefault(); openEmne(a.dataset.go); });
}

/* ---------- minimal markdown (skitse) ---------- */
function mdToHtml(md) {
  const lines = md.split('\n'); let out = [], inUl = false, inTbl = false, para = [];
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/\[\[([a-z0-9-]+)\]\]/g, (m, s) => `<a href="#" data-go="${s}">${esc(bySlug[s]?.title || s)}</a>`);
  const flushP = () => { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } };
  const endUl = () => { if (inUl) { out.push('</ul>'); inUl = false; } };
  const endTbl = () => { if (inTbl) { out.push('</table>'); inTbl = false; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^## /.test(l)) { flushP(); endUl(); endTbl(); const h = l.slice(3); out.push(`<h2 class="${/Begreber/.test(h) ? 'begreber' : ''}">${inline(h)}</h2>`); continue; }
    if (/^\|/.test(l)) { flushP(); endUl(); if (/^\|[\s-|]+\|$/.test(l)) continue; if (!inTbl) { out.push('<table>'); inTbl = true; } const cells = l.slice(1, -1).split('|'); const tag = out[out.length - 1] === '<table>' ? 'th' : 'td'; out.push('<tr>' + cells.map(c => `<${tag}>${inline(c.trim())}</${tag}>`).join('') + '</tr>'); continue; }
    endTbl();
    if (/^(- |\d+\. )/.test(l)) { flushP(); if (!inUl) { out.push('<ul>'); inUl = true; } out.push('<li>' + inline(l.replace(/^(- |\d+\. )/, '')) + '</li>'); continue; }
    if (l === '') { flushP(); endUl(); continue; }
    para.push(l);
  }
  flushP(); endUl(); endTbl();
  return out.join('\n');
}

/* ---------- palette / spring ---------- */
const q = document.getElementById('q'), pal = document.getElementById('palette'); let sel = 0;
function buildPalette(s) {
  const t = s.toLowerCase().trim();
  const hits = emner.filter(e => !t || [e.title, e.blik, e.kort, e.teoretikere.join(' '), e.interesse].join(' ').toLowerCase().includes(t)).slice(0, 14);
  pal.innerHTML = hits.map((e, i) => `<div class="row${i === 0 ? ' sel' : ''}" data-slug="${e.slug}"><span class="b">${esc(e.blik)}</span><span>${esc(e.title)}</span><span class="k">${esc(e.teoretikere[0])}</span></div>`).join('') || '<div class="row">Ingen emner matcher</div>';
  sel = 0; pal.querySelectorAll('.row[data-slug]').forEach(r => r.onclick = () => go(r.dataset.slug));
}
function go(slug) { pal.classList.remove('open'); q.value = ''; openEmne(slug); }
q.addEventListener('focus', () => { buildPalette(q.value); pal.classList.add('open'); });
q.addEventListener('input', () => buildPalette(q.value));
q.addEventListener('keydown', ev => {
  const rows = [...pal.querySelectorAll('.row[data-slug]')];
  if (ev.key === 'ArrowDown') { sel = Math.min(sel + 1, rows.length - 1); } else if (ev.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); }
  else if (ev.key === 'Enter') { if (rows[sel]) go(rows[sel].dataset.slug); return; } else if (ev.key === 'Escape') { pal.classList.remove('open'); q.blur(); return; } else return;
  rows.forEach((r, i) => r.classList.toggle('sel', i === sel)); ev.preventDefault();
});
document.addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); q.focus(); q.select(); } if (ev.key === 'Escape') { side.classList.remove('open'); mark(null); } });
document.addEventListener('click', ev => { if (!pal.contains(ev.target) && ev.target !== q) pal.classList.remove('open'); });

/* ---------- view toggle ---------- */
document.querySelectorAll('.toggle button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.toggle button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === b.dataset.view));
});
</script>
</body>
</html>
